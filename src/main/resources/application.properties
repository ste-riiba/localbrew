server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:localbrew_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:localbrew}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

upload.base-path=${UPLOAD_BASE_PATH:uploads}
upload.base-url=${UPLOAD_BASE_URL:/uploads}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# Upload immagini
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
