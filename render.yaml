services:
  - type: web
    name: localbrew
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: localbrew-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: localbrew-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: localbrew-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: localbrew-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: localbrew-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: HIBERNATE_DDL_AUTO
        value: update
      - key: UPLOAD_BASE_PATH
        value: /tmp/localbrew/uploads
      - key: UPLOAD_BASE_URL
        value: /uploads

databases:
  - name: localbrew-db
    plan: free
    databaseName: localbrew
    user: localbrew
